# The gate on every push: Core unchanged byte for byte, forge build, the Core recorded on Base
# Sepolia is the Core this tree builds, the ABI package equal to forge's build and to the deployment
# records, every forge test (unit, invariants, the hostile invariants, the SDK vectors and gas
# fixtures Core writes, the deployment), the fixtures unchanged after the tests rewrote them from
# Core, the exit kit's self-test, the typecheck of every TypeScript project, the SDK's tests, which
# compare it with those fixtures and run it against Core on local chains, the ABI package's tests,
# the tests of the delivery package and the test relay, which run on 127.0.0.1 only and contact no
# public relay, the preview card's tests, the view server's tests, which read local chains and
# scripted JSON-RPC nodes on 127.0.0.1 only, the web app's tests, the stand's and the command-line
# tool's, which start their own anvil and relay on 127.0.0.1, the app's build, and every scenario of
# the demo engine in a browser on a stand of its own. The browser suites (tests/e2e) need a running
# stand and are run by hand.
# It needs no secret and deploys nothing: every chain it uses is an anvil it starts itself.
#
# The checks run as parallel jobs, each on a runner of its own; the run passes when every job does.
# Each job sets up only what it needs (.github/actions/setup) and checks that Core is unchanged
# before and after. Each job that reads contracts/out runs forge build itself: nothing compiled is
# cached, so the checks of the deployed Core and of the ABI package read what this run built.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every script calls Foundry by path (bare `forge` may be another program).
  FOUNDRY_BIN: /home/runner/.foundry/bin
  CORE_SHA256: 118f4d37f8a9d54d33245760b0f5871cbb79bf9bf4a7f152d89e84ef5713d738

jobs:
  # Core: forge build, the deployed Core and the ABI package against that build, every forge test,
  # the fixtures, the exit kit.
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup

      - name: Build
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      # packages/abi/src/generated.ts holds Core's ABI and the deployment records: @wagmi/cli
      # regenerates it from the build above and contracts/deployments, and it must equal the commit.
      - name: ABI package matches the build
        run: bun run check:abi

      # Offline, from contracts/deployments/84532.json: keccak256 of the AHandCore built here equals
      # the recorded initcodeHash, and create2(factory, salt, initcodeHash) is the recorded Core. A
      # change to Core's source or build settings would move Core to another address.
      - name: Deployed Core is the Core this tree builds
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" test --match-contract DeploymentRecordTest'

      # WRITE_VECTORS=true: SdkVectors and SdkGas rewrite the fixtures from Core before comparing.
      - name: Test
        working-directory: contracts
        env:
          WRITE_VECTORS: "true"
        run: '"$FOUNDRY_BIN/forge" test'

      # The tests above rewrote these files from Core; a difference means Core and the committed
      # fixtures disagree.
      - name: Fixtures match Core
        # add -N makes a fixture a test wrote but nobody committed show up in the diff too.
        run: git add -N contracts/test/fixtures && git diff --exit-code -- contracts/test/fixtures

      - name: Exit kit self-test
        env:
          # The self-test starts its own anvil on this port.
          SELFTEST_PORT: "19210"
        run: bash contracts/exit/selftest.sh

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup
        with:
          contracts: "false"

      # Every TypeScript project, several tsc at once (infra/gate/gate.ts).
      - name: Typecheck
        run: bun run typecheck

      # The demo engine's catalogue is its scenarios', and the atlas has a place for every route of
      # the app: both read source files only, no stand and no browser.
      - name: Demo catalogue and atlas routes
        run: |
          bun run check:catalogue
          bun run check:atlas

      # The local gate's runner (bun run check): failures, the order, and that it runs every check.
      - name: Gate runner tests
        run: bun run test:gate

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup

      - name: Build
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      # The SDK's tests read Core's artifacts from contracts/out, compare the SDK with the fixtures
      # committed beside Core (the contracts job proves Core still writes them byte for byte), and
      # start their own anvil from $FOUNDRY_BIN.
      - name: SDK tests
        run: bun run test:sdk

      - name: ABI package tests
        run: bun run test:abi

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  # The delivery package, the preview card, the test relay, the view server and the command-line tool.
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup

      - name: Build
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      # NIP-17 wrapping, the transport against the test relay and against scripted relays (forged
      # copies, CLOSED, NIP-42 AUTH, refusals), and the outbox's retries and delivered rule.
      - name: Delivery package tests
        run: bun run test:deliver

      # The link's preview card shared by the view server and the raise screen: its words, its
      # model, and the same drawing for satori and for a page.
      - name: Preview card tests
        run: bun run test:card

      - name: Test relay tests
        run: bun run test:relay

      # The preview server: tags and cards against local chains, its own client against scripted
      # nodes (one batch, CCIP-Read off, the deadline), the function form, and the server as a program.
      - name: View server tests
        run: bun run test:view

      # The command-line tool against local chains: inspect, pass, thank-calldata, verify, find, recover.
      - name: Command-line tool tests
        run: bun run test:tools

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  # The web app, the stand, and the app's build.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup

      - name: Build
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      # The web app: its units, its guards over the tree, the delivery outbox against the test relay,
      # the CSP and Vercel's settings, and raises and thanks against Core on local chains.
      - name: Web app tests
        run: bun run test:web

      # The local stand: ports, fixtures, and stands brought up and down on their own slots.
      - name: Stand tests
        run: bun run test:stand

      - name: Web app build
        run: bun run build

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  # Every scenario of the demo engine (tests/demo), headless, on a stand each shard brings up
  # itself: an anvil, Core and the test contracts deployed by Deploy.s.sol, the relay, the built
  # app. The scenarios are split by count over four runners (--shard, --fully-parallel), each with a
  # stand of its own, so no two shards share a chain; within a shard they run one after another as
  # on one stand by hand. A scenario that fails leaves its trace, its screenshots and every
  # persona's video as an artifact.
  #
  # On every push, not only for next and main: it is the one check in CI that drives the app in a
  # browser, and work reaches next from exp/ branches only after review, so a scenario a change
  # breaks should fail on the branch before the review, not on next after it.
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      STAND_SLOT: "0"
      DEMO_VIDEO: on-failure
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict

      - uses: ./.github/actions/setup

      # Headless runs use the headless shell only. It is kept between runs under a key of the
      # lockfile, which pins Playwright's version. So are the system packages Playwright installs
      # for it (libraries and the fonts pages are drawn with), as .deb files, under the runner
      # image's version too: from four runners at once the package mirror took up to two minutes.
      # When the kept packages do not install, Playwright installs them as before.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The runner's own variables, which expressions cannot read.
      - name: Runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: debs
        with:
          path: ~/chromium-debs
          key: chromium-debs-${{ steps.image.outputs.version }}-${{ hashFiles('bun.lock') }}

      - name: Chromium for Playwright
        run: |
          if [ "${{ steps.debs.outputs.cache-hit }}" = true ] && sudo dpkg -i ~/chromium-debs/*.deb > /dev/null; then
            bunx playwright install --only-shell chromium
          else
            bunx playwright install --with-deps --only-shell chromium
            mkdir -p ~/chromium-debs
            cp /var/cache/apt/archives/*.deb ~/chromium-debs/
          fi

      - name: Build contracts
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      - name: Stand up
        run: bun infra/stand/stand.ts up --slot 0

      - name: Scenarios
        run: bunx playwright test -c playwright.demo.config.ts --fully-parallel --shard ${{ matrix.shard }}/4

      - name: Stand logs
        if: failure()
        run: tail -n 100 infra/stand/.run/0/logs/* || true

      - name: Down
        if: always()
        run: bun infra/stand/stand.ts down --slot 0

      - name: What failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-failed-${{ matrix.shard }}
          # The HTML report holds every failed scenario's trace, screenshots and videos already.
          path: tests/demo/report/
          retention-days: 14

      - name: Core is still unchanged
        run: |
          echo "$CORE_SHA256  contracts/src/AHandCore.sol" | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol
