# The gate on every push: Core unchanged byte for byte, forge build, the Core recorded on Base
# Sepolia is the Core this tree builds, the ABI package equal to forge's build and to the deployment
# records, every forge test (unit, invariants, the hostile invariants, the SDK vectors and gas
# fixtures Core writes, the deployment), the fixtures unchanged after the tests rewrote them from
# Core, the exit kit's self-test, the typecheck of the SDK, its tests, the ABI package, the delivery
# package, the preview card, the test relay, the view server, the stand, the web app, the
# command-line tool and the browser suites, the SDK's tests, which compare it with those fixtures
# and run it against Core on local chains, the ABI package's tests, the tests of the delivery package
# and the test relay, which run on 127.0.0.1 only and contact no public relay, the preview card's
# tests, and the view server's tests, which read local chains and scripted JSON-RPC nodes on
# 127.0.0.1 only, the web app's tests, the stand's and the command-line tool's, which start their
# own anvil and relay on 127.0.0.1, and the app's build. The browser suites (tests/e2e) need a
# running stand and are run by hand; the demo engine's scenarios (job scenarios) bring their own.
# It needs no secret and deploys nothing: every chain it uses is an anvil it starts itself.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    # The web app's, the stand's and the tool's tests and the app's build were added to this job and
    # have not been timed on a runner yet: room above the 30 minutes the contracts and SDK needed.
    timeout-minutes: 45
    env:
      # Every script calls Foundry by path (bare `forge` may be another program).
      FOUNDRY_BIN: /home/runner/.foundry/bin
      # The exit kit's self-test starts its own anvil on this port.
      SELFTEST_PORT: "19210"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Core is unchanged
        run: echo 'e9612b54f0f60af275253d87b4d899bbceb2f59e749fcd06dd6b1fc51c655772  contracts/src/AHandCore.sol' | sha256sum --check --strict

      # contracts/lib is not in the repository. The two libraries Core and its tests build against.
      - name: Contract libraries
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts contracts/lib/openzeppelin-contracts

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Foundry where the scripts look for it
        run: |
          mkdir -p "$FOUNDRY_BIN"
          # foundry-toolchain may already install into $FOUNDRY_BIN: linking a tool onto itself would replace it with a loop.
          for tool in forge cast anvil chisel; do
            found=$(command -v $tool)
            if [ "$(readlink -f "$found")" != "$(readlink -f "$FOUNDRY_BIN/$tool" 2>/dev/null)" ]; then ln -sf "$found" "$FOUNDRY_BIN/$tool"; fi
          done
          "$FOUNDRY_BIN/forge" --version

      - name: Build
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The demo engine's catalogue is its scenarios', and the atlas has a place for every route of
      # the app: both read source files only, no stand and no browser.
      - name: Demo catalogue and atlas routes
        run: |
          bun run check:catalogue
          bun run check:atlas

      # packages/abi/src/generated.ts holds Core's ABI and the deployment records: @wagmi/cli
      # regenerates it from the build above and contracts/deployments, and it must equal the commit.
      - name: ABI package matches the build
        run: bun run check:abi

      # Offline, from contracts/deployments/84532.json: keccak256 of the AHandCore built here equals
      # the recorded initcodeHash, and create2(factory, salt, initcodeHash) is the recorded Core. A
      # change to Core's source or build settings would move Core to another address.
      - name: Deployed Core is the Core this tree builds
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" test --match-contract DeploymentRecordTest'

      # WRITE_VECTORS=true: SdkVectors and SdkGas rewrite the fixtures from Core before comparing.
      - name: Test
        working-directory: contracts
        env:
          WRITE_VECTORS: "true"
        run: '"$FOUNDRY_BIN/forge" test'

      # The tests above rewrote these files from Core; a difference means Core and the committed
      # fixtures disagree.
      - name: Fixtures match Core
        # add -N makes a fixture a test wrote but nobody committed show up in the diff too.
        run: git add -N contracts/test/fixtures && git diff --exit-code -- contracts/test/fixtures

      - name: Exit kit self-test
        run: bash contracts/exit/selftest.sh

      # After the build and the fixtures: the SDK's tests read Core's artifacts from contracts/out,
      # compare the SDK with the fixtures Core wrote, and start their own anvil from $FOUNDRY_BIN.
      - name: SDK tests
        run: bun run test:sdk

      - name: ABI package tests
        run: bun run test:abi

      # NIP-17 wrapping, the transport against the test relay and against scripted relays (forged
      # copies, CLOSED, NIP-42 AUTH, refusals), and the outbox's retries and delivered rule.
      - name: Delivery package tests
        run: bun run test:deliver

      # The link's preview card shared by the view server and the raise screen: its words, its
      # model, and the same drawing for satori and for a page.
      - name: Preview card tests
        run: bun run test:card

      - name: Test relay tests
        run: bun run test:relay

      # The preview server: tags and cards against local chains, its own client against scripted
      # nodes (one batch, CCIP-Read off, the deadline), the function form, and the server as a program.
      - name: View server tests
        run: bun run test:view

      # The web app: its units, its guards over the tree, the delivery outbox against the test relay,
      # the CSP and Vercel's settings, and raises and thanks against Core on local chains.
      - name: Web app tests
        run: bun run test:web

      # The local stand: ports, fixtures, and stands brought up and down on their own slots.
      - name: Stand tests
        run: bun run test:stand

      # The command-line tool against local chains: inspect, pass, thank-calldata, verify, find, recover.
      - name: Command-line tool tests
        run: bun run test:tools

      - name: Web app build
        run: bun run build

      - name: Core is still unchanged
        run: |
          echo 'e9612b54f0f60af275253d87b4d899bbceb2f59e749fcd06dd6b1fc51c655772  contracts/src/AHandCore.sol' | sha256sum --check --strict
          git diff --exit-code -- contracts/src/AHandCore.sol

  # Every scenario of the demo engine (tests/demo), headless, on a stand the job brings up itself:
  # an anvil, Core and the test contracts deployed by Deploy.s.sol, the relay, the built app. A
  # scenario that fails leaves its trace, its screenshots and every persona's video as an
  # artifact. Like the job above, this has not run on GitHub yet: the same commands were run by
  # hand on a fresh slot (tests/demo/README.md, "As CI runs it").
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FOUNDRY_BIN: /home/runner/.foundry/bin
      STAND_SLOT: "0"
      DEMO_VIDEO: on-failure
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Contract libraries
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts contracts/lib/openzeppelin-contracts

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Foundry where the scripts look for it
        run: |
          mkdir -p "$FOUNDRY_BIN"
          for tool in forge cast anvil chisel; do
            found=$(command -v $tool)
            if [ "$(readlink -f "$found")" != "$(readlink -f "$FOUNDRY_BIN/$tool" 2>/dev/null)" ]; then ln -sf "$found" "$FOUNDRY_BIN/$tool"; fi
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Build contracts
        working-directory: contracts
        run: '"$FOUNDRY_BIN/forge" build'

      - name: Stand up
        run: bun infra/stand/stand.ts up --slot 0

      - name: Scenarios
        run: bunx playwright test -c playwright.demo.config.ts

      - name: Stand logs
        if: failure()
        run: tail -n 100 infra/stand/.run/0/logs/* || true

      - name: Down
        if: always()
        run: bun infra/stand/stand.ts down --slot 0

      - name: What failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-failed
          # The HTML report holds every failed scenario's trace, screenshots and videos already.
          path: tests/demo/report/
          retention-days: 14

