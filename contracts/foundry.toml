[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read-write", path = "../packages/sdk/tests" },
    # gas series of test/AHandV2.settlement.t.sol (${OUT}/gas-series.txt, DESIGN §17.2)
    { access = "read-write", path = "/tmp/claude-1001/-home-guy-do-or-die-workspace-ahand/623ee448-3599-4496-b448-9b7b8bdea6c5/scratchpad/corev2" },
]

[fuzz]
runs = 256

# Stateful invariants: 64 runs × 128 calls keeps a three-token, contract-actor
# handler suite under three minutes; a suite may raise depth with forge-config.
[invariant]
runs = 64
depth = 128
fail_on_revert = true
