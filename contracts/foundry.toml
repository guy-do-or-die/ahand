[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read-write", path = "../packages/sdk/tests" },
    # gas series of test/AHandV2.settlement.t.sol (DESIGN §17.2): out/gas/gas-series.txt unless OUT says otherwise
    { access = "read-write", path = "out/gas" },
]

[fuzz]
runs = 256

# Stateful invariants: 64 runs × 128 calls keeps a three-token, contract-actor
# handler suite under three minutes; a suite may raise depth with forge-config.
[invariant]
runs = 64
depth = 128
fail_on_revert = true
