[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.35"
# evm_version is part of Core's build: it is written into the metadata at the tail of the initcode,
# so changing it changes Core's initcode hash and so its CREATE2 address (a forge test compares the
# hash with deployments/84532.json). Prague also gives the tests EIP-7702 accounts.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Remappings are written into Core's metadata, and the metadata hash is the tail of its initcode.
# Foundry's auto-detected remappings include one with this folder's absolute path, which made the
# initcode hash, and so Core's CREATE2 address, depend on where the clone sits; anyone must be able
# to rebuild it from the commit. Only relative remappings, named here, keep it the same anywhere.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./test/fixtures" }, # the fixtures Core writes for the SDK
    { access = "read-write", path = "./deployments" },   # the deployment JSON script/Deploy.s.sol writes
]

[fuzz]
runs = 1024

[invariant]
runs = 64
depth = 128
fail_on_revert = true

[fmt]
multiline_func_header = "params_first_multi" # a header that does not fit one line: each parameter on its own line, then `) attributes {`, as OpenZeppelin writes
